name: Verify production deploy

# After every push to main, wait for the Cloudflare Pages check on that commit and
# confirm the live site serves the security headers, on pages.dev and on the production
# domain (managementik.com), which can lag pages.dev by a minute after a deploy. Fails (and emails the repo
# admins) when production did not deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      # Cloudflare's built-in address for the Pages project, and the custom domain real users open.
      SITE_URL: https://accountant-client-link.pages.dev
      PROD_URL: https://managementik.com
    steps:
      - name: Wait for the Cloudflare Pages check on this commit
        run: |
          for i in $(seq 1 60); do
            out=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '.check_runs[] | select(.name=="Cloudflare Pages") | "\(.status) \(.conclusion)"' | head -1)
            echo "[$i] Cloudflare Pages: ${out:-not reported yet}"
            case "$out" in
              "completed success") exit 0 ;;
              "completed "*) echo "::error::Cloudflare Pages build did not succeed ($out)"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out waiting for the Cloudflare Pages check"; exit 1
      - name: Live site serves the security headers
        run: |
          headers=$(curl -fsSI "$SITE_URL/")
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:' || { echo "::error::CSP header missing on $SITE_URL"; exit 1; }
          echo "$headers" | grep -qi '^strict-transport-security:' || { echo "::error::HSTS header missing on $SITE_URL"; exit 1; }
      - name: Production domain serves a build (informational comparison with pages.dev)
        run: |
          bundle() { curl -fsS "$1/" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1; }
          prod=$(bundle "$PROD_URL" || true)
          [ -n "$prod" ] || { echo "::error::Could not read the bundle name from $PROD_URL"; exit 1; }
          pages=$(bundle "$SITE_URL" || true)
          echo "$PROD_URL serves $prod; $SITE_URL serves ${pages:-nothing}"
          # The two addresses are the same Pages project but one can lag the other for a while, and the
          # lag has gone both ways, so a difference is reported but not a failure. The render check
          # below is what gates the run.
          [ "$prod" = "$pages" ] || echo "::warning::$PROD_URL and $SITE_URL serve different builds ($prod vs ${pages:-nothing})"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Login page renders on the production domain
        run: node scripts/verify-site.mjs "$PROD_URL"
